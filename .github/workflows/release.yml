name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  # -------------------------------------------------------------------------
  # Run tests in parallel for both Scala versions
  # -------------------------------------------------------------------------
  test:
    name: Test (Scala ${{ matrix.scala }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        scala: ["2.13.15", "2.12.20"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        env:
          JAVA_OPTS: >-
            --add-opens=java.base/javax.security.auth=ALL-UNNAMED
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
            --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
            --add-opens=java.base/java.io=ALL-UNNAMED
            --add-opens=java.base/java.net=ALL-UNNAMED
            --add-opens=java.base/java.nio=ALL-UNNAMED
            --add-opens=java.base/java.util=ALL-UNNAMED
            --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
            --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED
            --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
            --add-opens=java.base/sun.nio.cs=ALL-UNNAMED
            --add-opens=java.base/sun.security.action=ALL-UNNAMED
            --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
            --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED
        run: sbt ++${{ matrix.scala }} test

  # -------------------------------------------------------------------------
  # Publish Python wheel to PyPI (runs in parallel with Maven publish)
  # -------------------------------------------------------------------------
  publish-pypi:
    name: Publish Python wheel to PyPI
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm needs full tag history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Build assembly JAR (Scala 2.13)
        run: sbt "++2.13.15 assembly"

      - name: Copy JAR into Python package
        run: cp target/scala-2.13/spark-asn1_2.13-*-assembly.jar python/pyspark_asn1/spark-asn1-assembly.jar

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          pip install build setuptools-scm
          cd python
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  # -------------------------------------------------------------------------
  # Publish to Maven Central + create GitHub Release (runs after both tests pass)
  # -------------------------------------------------------------------------
  publish:
    name: Publish & Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # dynver needs full tag history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Import GPG signing key
        run: echo "$PGP_SECRET" | base64 --decode | gpg --import --batch
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      # sbt +publishSigned cross-publishes for all versions in crossScalaVersions,
      # then sonatypeBundleRelease uploads and releases the bundle in one shot.
      - name: Publish to Maven Central
        run: sbt +publishSigned sonatypeBundleRelease
        env:
          PGP_PASSPHRASE:      ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME:   ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD:   ${{ secrets.SONATYPE_PASSWORD }}

      # Build shaded assembly JARs for both Scala versions to attach to the GitHub Release
      - name: Build assembly JARs
        run: sbt +assembly

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "spark-asn1 ${{ github.ref_name }}" \
            --generate-notes \
            target/scala-2.13/spark-asn1_2.13-*-assembly.jar \
            target/scala-2.12/spark-asn1_2.12-*-assembly.jar
