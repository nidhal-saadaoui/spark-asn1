name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  # -------------------------------------------------------------------------
  # Run tests + build assembly JAR for each Scala version
  # -------------------------------------------------------------------------
  build:
    name: Build (Scala ${{ matrix.scalaBin }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - scala: "2.13.15"
            scalaBin: "2.13"
          - scala: "2.12.20"
            scalaBin: "2.12"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # dynver needs full tag history to compute version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        env:
          JAVA_OPTS: >-
            --add-opens=java.base/javax.security.auth=ALL-UNNAMED
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
            --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
            --add-opens=java.base/java.io=ALL-UNNAMED
            --add-opens=java.base/java.net=ALL-UNNAMED
            --add-opens=java.base/java.nio=ALL-UNNAMED
            --add-opens=java.base/java.util=ALL-UNNAMED
            --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
            --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED
            --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
            --add-opens=java.base/sun.nio.cs=ALL-UNNAMED
            --add-opens=java.base/sun.security.action=ALL-UNNAMED
            --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
            --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED
        run: sbt ++${{ matrix.scala }} test

      - name: Build assembly JAR
        run: sbt ++${{ matrix.scala }} assembly

      - name: Upload assembly JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-scala-${{ matrix.scalaBin }}
          path: target/scala-${{ matrix.scalaBin }}/spark-asn1-*-assembly.jar
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Collect both JARs and publish the GitHub Release
  # -------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Scala 2.13 JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-scala-2.13
          path: jars/

      - name: Download Scala 2.12 JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-scala-2.12
          path: jars/

      - name: Create release and attach JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "spark-asn1 ${{ github.ref_name }}" \
            --generate-notes \
            jars/*.jar
